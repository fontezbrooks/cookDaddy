  - '@expo/router-server@56.0.11'
  - '@expo/ui@56.0.11'
  - babel-preset-expo@56.0.11
  - expo-asset@56.0.13
  - expo-constants@56.0.14
  - expo-image@56.0.8
  - expo-linking@56.0.11
  - expo-modules-autolinking@56.0.11
  - expo-modules-core@56.0.12
  - expo-router@56.2.5
  - expo-system-ui@56.0.5
  - expo-web-browser@56.0.5
  - expo@56.0.3
